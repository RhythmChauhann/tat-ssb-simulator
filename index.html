<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TAT SSB Simulator</title>
<!-- PDF.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<!-- Shared styles -->
<link rel="stylesheet" href="styles.css">
</head>
<body>
<!-- TOPBAR -->
<div class="topbar">
  <div class="title">TAT SSB Simulator</div>
  <div class="controls">
    <button id="startBtn">Start Test</button>
    <button id="skipBtn">Skip Timer</button>
    <button id="stopBtn">Stop Test</button>
  </div>
</div>
<!-- MAIN -->
<div class="main">
  <!-- LEFT -->
  <div class="viewer">
    <div class="viewerMessage" id="viewerMessage">READY TO START TEST</div>
    <canvas id="pdfCanvas"></canvas>
  </div>
  <!-- RIGHT -->
  <div class="sidebar">
    <div class="statusCard">
      <div class="statusTitle">Current Status</div>
      <div class="statusValue" id="status">Waiting...</div>
    </div>
    <div class="statusCard">
      <div class="statusTitle">Timer</div>
      <div class="timerBox" id="bigTimer">00:00</div>
    </div>
    <div class="statusCard">
      <div class="statusTitle">Progress</div>
      <div class="statusValue" id="pictureCount">Picture 0 / 12</div>
    </div>
    <button class="menuBtn" id="toggleLogBtn">Open Review Menu</button>
    <div id="reviewContainer"></div>
  </div>
</div>
<div id="watermark">made by rhythm chauhan</div>
<!-- Shared core logic -->
<script src="tat-core.js"></script>
<script>
// Load default PDF on startup
initTAT("tat.pdf");
</script>
</body>
</html>
